<script>
    // Original smooth scrolling
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener('click', function (e) {
            e.preventDefault();
            const target = document.querySelector(this.getAttribute('href'));
            if (target) {
                target.scrollIntoView({behavior: 'smooth', block: 'start'});
            }
        });
    });

    // Header scroll effect
    window.addEventListener('scroll', () => {
        const header = document.querySelector('header');
        if (window.scrollY > 100) {
            header.style.background = 'rgba(255, 255, 255, 0.98)';
        } else {
            header.style.background = 'rgba(255, 255, 255, 0.95)';
        }
    });

    // NEW FEATURES: Admin Panel, Image Upload, Shopping Cart
    let cart = [];

    // Toggle Admin Panel
    function toggleAdminPanel() {
        const panel = document.getElementById('adminPanel');
        panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    }

    // Update Product Images
    function updateProductImage(event, productId) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.querySelector(`img[data-product="${productId}"]`);
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
    }

    // Add to Cart
    function addToCart(name, price, button) {
        button.disabled = true;
        button.textContent = 'Added! ✅';
        setTimeout(() => {
            button.disabled = false;
            button.textContent = '🛒 Add to Cart';
        }, 1500);

        cart.push({name, price, qty: 1});
        updateCartDisplay();
    }

    // Update Cart Display
    function updateCartDisplay() {
        document.getElementById('cartCount').textContent = cart.reduce((sum, item) => sum + item.qty, 0);
    }

    // Toggle Cart Modal
    function toggleCart() {
        const modal = document.getElementById('cartModal');
        modal.classList.toggle('active');
        if (modal.classList.contains('active')) {
            displayCartItems();
        }
    }

    // Display Cart Items
    function displayCartItems() {
        const cartItems = document.getElementById('cartItems');
        const total = document.getElementById('cartTotal');
        
        if (cart.length === 0) {
            cartItems.innerHTML = '<p style="text-align:center;color:#666;">Your cart is empty</p>';
            total.textContent = 'Total: ₹0';
            return;
        }

        let html = '';
        let totalPrice = 0;
        
        cart.forEach((item, index) => {
            totalPrice += item.price * item.qty;
            html += `
                <div class="cart-item" style="display:flex;align-items:center;gap:1rem;padding:1rem 0;border-bottom:1px solid #eee;">
                    <img src="${document.querySelector(`img[data-product="${item.name.toLowerCase().replace(' powder', '').replace(' ', '-')}"]`)?.src || ''}" style="width:60px;height:60px;object-fit:cover;border-radius:10px;">
                    <div style="flex:1;">
                        <h4>${item.name}</h4>
                        <p>₹${item.price} x <span class="qty-controls" style="display:flex;align-items:center;gap:0.5rem;">
                            <button class="qty-btn" onclick="changeQty(${index}, -1)" style="background:#ff6b35;color:white;border:none;width:30px;height:30px;border-radius:50%;cursor:pointer;">-</button>
                            ${item.qty}
                            <button class="qty-btn" onclick="changeQty(${index}, 1)" style="background:#ff6b35;color:white;border:none;width:30px;height:30px;border-radius:50%;cursor:pointer;">+</button>
                        </span></p>
                    </div>
                    <button onclick="removeItem(${index})" style="background:#dc3545;color:white;border:none;padding:0.5rem 1rem;border-radius:5px;cursor:pointer;">Remove</button>
                </div>
            `;
        });
        
        cartItems.innerHTML = html;
        total.textContent = `Total: ₹${totalPrice}`;
    }

    // Change Quantity
    function changeQty(index, delta) {
        cart[index].qty += delta;
        if (cart[index].qty <= 0) {
            cart.splice(index, 1);
        }
        displayCartItems();
        updateCartDisplay();
    }

    // Remove Item
    function removeItem(index) {
        cart.splice(index, 1);
        displayCartItems();
        updateCartDisplay();
    }

    // Checkout
    function checkout() {
        if (cart.length === 0) return;
        alert(`Order Summary:\n${cart.map(item => `${item.name} x${item.qty} = ₹${item.price * item.qty}`).join('\n')}\n\nTotal: ₹${cart.reduce((sum, item) => sum + item.price * item.qty, 0)}\n\nContact Vimal: 7379969545`);
        cart = [];
        toggleCart();
        updateCartDisplay();
    }

    // Close cart on outside click
    window.onclick = function(event) {
        const modal = document.getElementById('cartModal');
        if (event.target === modal) {
            toggleCart();
        }
    }
</script>
