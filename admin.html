<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shri Spices Admin</title><style>body{font:16px Arial;background:#fff7f1;margin:0;color:#333}header{background:#ff6b35;color:white;padding:18px}main{max-width:1000px;margin:auto;padding:18px}section{background:white;padding:20px;border-radius:14px;margin:16px 0;box-shadow:0 3px 14px #ddd}input,textarea,select{padding:10px;margin:6px 0;width:100%;box-sizing:border-box}button{background:#ff6b35;color:white;border:0;border-radius:8px;padding:10px 14px;margin:4px;cursor:pointer}table{border-collapse:collapse;width:100%;overflow:auto}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:650px){.row{grid-template-columns:1fr}}</style></head><body><header><h1>Shri Spices Admin</h1></header><main><section id="login"><h2>Admin Login</h2><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">Login</button><p id="loginMsg"></p></section><div id="panel" hidden><button id="logout">Logout</button><section><h2>Add / Edit Product</h2><input id="pid" type="hidden"><input id="pname" placeholder="Product name"><textarea id="pdesc" placeholder="Description"></textarea><input id="pimage" placeholder="Image URL"><label><input type="checkbox" id="active" checked> Active</label><h3>Variant (add a pack)</h3><div class="row"><input id="vname" placeholder="Pack size (e.g. 100g)"><input id="vprice" type="number" placeholder="Price ₹"></div><input id="vstock" type="number" placeholder="Stock"><button id="save">Save Product + Variant</button><button id="reset">Clear</button><p id="saveMsg"></p></section><section><h2>Products</h2><div id="products"></div></section><section><h2>Orders</h2><div id="orders"></div></section><section><h2>B2B Leads</h2><div id="leads"></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script>const adminUserId='add644f1-02c3-46a6-a913-f0ae08a2203e';const $=id=>document.getElementById(id);$('loginBtn').onclick=async()=>{const {data,error}=await supabaseClient.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){$('loginMsg').textContent=error.message;return;}const {data:adm,error:ae}=await supabaseClient.from('admin_users').select('user_id,role').eq('user_id',data.user.id).maybeSingle();if(ae||!adm){await supabaseClient.auth.signOut();$('loginMsg').textContent='This account is not authorized.';return;}show();};async function show(){ $('login').hidden=true;$('panel').hidden=false;await refresh();} $('logout').onclick=async()=>{await supabaseClient.auth.signOut();location.reload();};async function refresh(){await products();await orders();await leads();}async function products(){let {data,error}=await supabaseClient.from('products').select('*,product_variants(*)').order('created_at',{ascending:false});if(error){$('products').textContent=error.message;return;} $('products').innerHTML='<table><tr><th>Product</th><th>Variants</th><th>Active</th><th>Actions</th></tr>'+data.map(p=>`<tr><td>${esc(p.name)}</td><td>${(p.product_variants||[]).map(v=>esc(v.name)+' ₹'+v.price+' stock '+v.stock).join('<br>')}</td><td>${p.active?'Yes':'No'}</td><td><button onclick="editProduct('${p.id}')">Edit</button><button onclick="delProduct('${p.id}')">Delete</button></td></tr>`).join('')+'</table>';window.productData=data;}window.editProduct=id=>{const p=productData.find(x=>x.id===id);$('pid').value=p.id;$('pname').value=p.name;$('pdesc').value=p.description||'';$('pimage').value=p.image_url||'';$('active').checked=p.active;const v=p.product_variants?.[0];$('vname').value=v?.name||'';$('vprice').value=v?.price||'';$('vstock').value=v?.stock||0;};window.delProduct=async id=>{if(!confirm('Delete product and variants?'))return;const {error}=await supabaseClient.from('products').delete().eq('id',id);if(error)alert(error.message);refresh();};$('save').onclick=async()=>{const id=$('pid').value;const payload={name:$('pname').value,description:$('pdesc').value,image_url:$('pimage').value||null,active:$('active').checked};if(!payload.name)return alert('Name required');let r=id?await supabaseClient.from('products').update(payload).eq('id',id).select().single():await supabaseClient.from('products').insert(payload).select().single();if(r.error){$('saveMsg').textContent=r.error.message;return;}const product=r.data;const v={product_id:product.id,name:$('vname').value||'Default',price:Number($('vprice').value),stock:Number($('vstock').value||0),active:true};if(!Number.isFinite(v.price)||v.price<=0){$('saveMsg').textContent='Enter a valid variant price';return;}let existing=product.product_variants?.[0];if(id){let {data:vars}=await supabaseClient.from('product_variants').select('id').eq('product_id',product.id).limit(1);existing=vars?.[0];}const vr=existing?await supabaseClient.from('product_variants').update(v).eq('id',existing.id):await supabaseClient.from('product_variants').insert(v);if(vr.error){$('saveMsg').textContent='Product saved; variant error: '+vr.error.message;return;}$('saveMsg').textContent='Saved';clear();refresh();};$('reset').onclick=clear;function clear(){$('pid').value='';$('pname').value='';$('pdesc').value='';$('pimage').value='';$('vname').value='';$('vprice').value='';$('vstock').value='';$('active').checked=true;}async function orders(){const {data,error}=await supabaseClient.from('orders').select('*').order('created_at',{ascending:false}).limit(100);$('orders').innerHTML=error?error.message:(data.length?'<table><tr><th>Ref</th><th>Customer</th><th>Amount</th><th>Status</th><th>Payment</th><th>Update</th></tr>'+data.map(o=>`<tr><td>${esc(o.order_number||o.id)}</td><td>${esc(o.customer_name||'')} ${esc(o.customer_phone||'')}</td><td>₹${o.total_amount}</td><td>${esc(o.status||'')}</td><td>${esc(o.payment_status||'unverified')}</td><td><select onchange="updOrder('${o.id}',this.value)"><option>${esc(o.status||'pending')}</option><option>pending</option><option>confirmed</option><option>processing</option><option>shipped</option><option>completed</option><option>cancelled</option></select></td></tr>`).join('')+'</table>':'No orders');}window.updOrder=async(id,status)=>{const {error}=await supabaseClient.from('orders').update({status}).eq('id',id);if(error)alert(error.message);orders();};async function leads(){const {data,error}=await supabaseClient.from('b2b_leads').select('*').order('created_at',{ascending:false}).limit(100);$('leads').innerHTML=error?error.message:(data.length?'<table><tr><th>Name</th><th>Business</th><th>Phone</th><th>Requirements</th><th>Status</th></tr>'+data.map(l=>`<tr><td>${esc(l.name)}</td><td>${esc(l.business_name||'')}</td><td>${esc(l.phone)}</td><td>${esc(l.requirements||'')}</td><td>${esc(l.status||'new')}</td></tr>`).join('')+'</table>':'No leads');}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}</script></body></html>
