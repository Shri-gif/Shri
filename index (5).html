<!-- Shopping Cart Modal -->
<div class="cart-modal" id="cartModal">
    <div class="cart-content">
        <span class="close-cart" onclick="toggleCart()" style="position:absolute;top:1rem;right:1.5rem;font-size:2rem;cursor:pointer;color:#666;">×</span>
        <h2 style="text-align:center;margin-bottom:2rem;color:#ff6b35;">🛒 Shopping Cart</h2>
        <div id="cartItems" style="max-height:300px;overflow-y:auto;"></div>
        <div class="cart-total" id="cartTotal" style="text-align:right;font-size:1.5rem;font-weight:bold;color:#ff6b35;margin-top:1rem;">Total: ₹0</div>
        <button class="checkout-btn" onclick="checkout()" style="width:100%;background:#28a745;color:white;border:none;padding:1rem;border-radius:10px;font-size:1.2rem;font-weight:bold;cursor:pointer;margin-top:1rem;">💳 Checkout</button>
    </div>
</div>
